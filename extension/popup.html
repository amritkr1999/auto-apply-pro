<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>EasyNaukri Harvester</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      width: 360px;
      background-color: #0f172a;
      color: #f8fafc;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #334155;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon {
      font-size: 22px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
      line-height: 1.2;
    }
    .subtitle {
      font-size: 10px;
      color: #64748b;
    }
    .status-badge {
      font-size: 10px;
      color: #4ade80;
      background: rgba(74, 222, 128, 0.1);
      border: 1px solid rgba(74, 222, 128, 0.3);
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
    .nav-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .tab-btn {
      flex: 1;
      padding: 6px;
      text-align: center;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #3b82f6;
      color: #ffffff;
      border-color: #3b82f6;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .job-title {
      font-size: 15px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 2px;
    }
    .company-name {
      font-size: 12px;
      font-weight: 600;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .meta-chip {
      background: #0f172a;
      border: 1px solid #334155;
      color: #cbd5e1;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 4px;
    }
    .section-box {
      background: #0f172a;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
      border: 1px solid #334155;
    }
    .section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .hr-name {
      font-weight: 600;
      color: #f1f5f9;
      font-size: 12px;
    }
    .hr-email {
      color: #4ade80;
      font-family: monospace;
      font-size: 11px;
      word-break: break-all;
    }
    .desc-box {
      max-height: 90px;
      overflow-y: auto;
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      text-align: center;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      text-decoration: none;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .action-btn.secondary {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
    }
    .empty-state {
      text-align: center;
      padding: 20px 10px;
      color: #94a3b8;
    }
    .history-list {
      max-height: 250px;
      overflow-y: auto;
    }
    .history-item {
      padding: 8px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      margin-bottom: 6px;
      cursor: pointer;
    }
    .history-item:hover {
      border-color: #3b82f6;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="icon">⚡</div>
      <div>
        <div class="title">EasyNaukri Harvester</div>
        <div class="subtitle">Auto Apply Node v1.0.0</div>
      </div>
    </div>
    <div class="status-badge">● Active</div>
  </div>

  <div class="nav-tabs">
    <button id="tab-latest" class="tab-btn active">🎯 Latest Harvested</button>
    <button id="tab-history" class="tab-btn">📜 Vault History</button>
  </div>

  <div id="latest-view">
    <div id="harvested-card-container">
      <!-- Dynamic harvested job details will be rendered here by popup.js -->
    </div>
  </div>

  <div id="history-view" style="display: none;">
    <div id="history-list-container" class="history-list">
      <!-- History list rendered here -->
    </div>
  </div>

  <div style="margin-top: 10px; display: flex; gap: 6px;">
    <a href="http://localhost:5173/opportunities/harvester?tab=harvested" target="_blank" class="action-btn" style="flex: 1;">📋 Open Web Vault ↗</a>
    <a href="http://localhost:5173/opportunities/import" target="_blank" class="action-btn secondary" style="flex: 1;">Open Dashboard ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
