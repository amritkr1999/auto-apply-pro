<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>EasyNaukri Harvester</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      width: 260px;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .icon {
      font-size: 24px;
    }
    .title {
      font-size: 14px;
      font-weight: bold;
      color: #38bdf8;
    }
    .status {
      font-size: 12px;
      color: #94a3b8;
      background: #1e293b;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .active-badge {
      display: inline-block;
      color: #4ade80;
      font-weight: bold;
    }
    .btn {
      display: block;
      margin-top: 12px;
      padding: 8px;
      text-align: center;
      background: #3b82f6;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">⚡</div>
    <div>
      <div class="title">EasyNaukri Harvester</div>
      <div style="font-size: 10px; color: #64748b;">v1.0.0 Manifest V3</div>
    </div>
  </div>
  <div class="status">
    Node Status: <span class="active-badge">● Active</span><br/>
    <span style="font-size: 10px; color: #94a3b8;">Scanning Naukri, LinkedIn & Indeed in background.</span>
  </div>
  <a href="http://localhost:5173/opportunities/import" target="_blank" class="btn">Open Dashboard ↗</a>
</body>
</html>
