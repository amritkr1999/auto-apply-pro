<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasyNaukri - Automated Job Application Platform</title>
    <meta name="application-name" content="EasyNaukri" />
    <meta name="apple-mobile-web-app-title" content="EasyNaukri" />
    <meta name="description" content="EasyNaukri is an automated job application & resume matching platform. Streamline your job search, optimize your resume, and send recruiter outreach emails effortlessly." />
    <meta property="og:title" content="EasyNaukri" />
    <meta property="og:site_name" content="EasyNaukri" />
    <meta property="og:url" content="https://easynaukri.online/" />
    <meta property="og:description" content="EasyNaukri uses Google Authentication (openid, email, profile) to create account profiles and Gmail Send scope (https://www.googleapis.com/auth/gmail.send) strictly to allow users to send personalized job application outreach emails to recruiters." />
    
    <!-- Schema.org Structured Data for Google OAuth App Name Verification -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "EasyNaukri",
      "alternateName": "EasyNaukri",
      "url": "https://easynaukri.online/",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "All",
      "description": "EasyNaukri is an automated job application & resume matching platform."
    }
    </script>

    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (savedTheme === 'system' && systemPrefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
