<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasyNaukri - Auto Job Application &amp; Cold Outreach Email Platform</title>
    <meta name="application-name" content="EasyNaukri" />
    <meta name="apple-mobile-web-app-title" content="EasyNaukri" />
    <meta name="description" content="EasyNaukri is an AI-powered auto job application and cold outreach email platform. Optimize your resume, streamline recruiter outreach, and automate job searches with one click." />
    <link rel="canonical" href="https://easynaukri.online/" />
    
    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:title" content="EasyNaukri - Auto Job Application &amp; Cold Outreach Email Platform" />
    <meta property="og:description" content="EasyNaukri is an AI-powered auto job application and cold outreach email platform. Optimize your resume, streamline recruiter outreach, and automate job searches with one click." />
    <meta property="og:site_name" content="EasyNaukri" />
    <meta property="og:url" content="https://easynaukri.online/" />
    <meta property="og:image" content="https://easynaukri.online/dashboard_mockup.png" />
    <meta property="og:type" content="website" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EasyNaukri - Auto Job Application &amp; Cold Outreach Email Platform" />
    <meta name="twitter:description" content="EasyNaukri is an AI-powered auto job application and cold outreach email platform. Optimize your resume, streamline recruiter outreach, and automate job searches with one click." />
    <meta name="twitter:image" content="https://easynaukri.online/dashboard_mockup.png" />

    <!-- SEO & Indexing -->
    <meta name="robots" content="index, follow" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    </noscript>
    
    <!-- Schema.org JSON-LD Structured Data (Organization + WebApplication) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "EasyNaukri",
          "url": "https://easynaukri.online/",
          "logo": "https://easynaukri.online/branding/easynaukri_logo.png"
        },
        {
          "@type": "WebApplication",
          "name": "EasyNaukri",
          "alternateName": "EasyNaukri Auto Apply & Outreach",
          "url": "https://easynaukri.online/",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "All",
          "description": "EasyNaukri is an AI-powered auto job application and cold outreach email platform. Optimize your resume, streamline recruiter outreach, and automate job searches with one click."
        }
      ]
    }
    </script>

    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (savedTheme === 'system' && systemPrefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <style>
      /* Zero-state instant skeleton loader style */
      .app-init-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        transition: opacity 0.2s ease-out;
      }
      html:not(.dark) .app-init-loader {
        background-color: #f8fafc;
        color: #0f172a;
      }
      .app-init-spinner {
        width: 42px;
        height: 42px;
        border: 3px solid rgba(99, 102, 241, 0.2);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: app-spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes app-spin {
        to { transform: rotate(360deg); }
      }
      .app-init-title {
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        margin-bottom: 6px;
      }
      .app-init-subtitle {
        font-size: 0.875rem;
        opacity: 0.65;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-init-loader">
        <div class="app-init-spinner"></div>
        <div class="app-init-title">EasyNaukri</div>
        <div class="app-init-subtitle">Loading application...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
