spring.application.name=backend
server.port=8060

# H2 In-Memory Database for Unit/Integration Tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=USER,VALUE,KEY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Redis repositories during tests
spring.data.redis.repositories.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Google OAuth Credentials
spring.security.oauth2.client.registration.google.client-id=dev-client-id
spring.security.oauth2.client.registration.google.client-secret=dev-client-secret
google.oauth2.redirect-uri=http://localhost:8060/api/v1/outreach/oauth2/callback
github.oauth2.redirect-uri=http://localhost:8060/api/v1/auth/callback/github
linkedin.oauth2.redirect-uri=http://localhost:8060/api/v1/auth/callback/linkedin

# Razorpay Configuration
