spring.config.import=optional:classpath:application-local.properties
spring.application.name=backend
server.port=8060

# PostgreSQL Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/autoapplypro
spring.datasource.username=amrit
spring.datasource.password=${DB_PASSWORD:amrit123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Google OAuth Credentials
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dev-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dev-client-secret}

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:test_secret_placeholder}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:webhook_secret_placeholder}

# Redis Cache Configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# AI Email Generation & Model Routing Config
pipeline.service.url=http://localhost:8000
email.llm.service-url=${pipeline.service.url}/generate-hook
email.llm.model.high-intel=gemini-1.5-pro
email.llm.model.low-cost=gemini-1.5-flash

# Google Gemini API Key
gemini.api.key=${GEMINI_API_KEY:}

# HikariCP Connection Pooling Configuration
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=2000

# CORS Allowed Origins Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}