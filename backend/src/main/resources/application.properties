spring.config.import=optional:classpath:application-local.properties
spring.application.name=backend
server.port=8060
server.forward-headers-strategy=framework


# PostgreSQL Connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/autoapplypro}
spring.datasource.username=${DB_USERNAME:amrit}
spring.datasource.password=${DB_PASSWORD:amrit123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Google OAuth Credentials
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dev-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dev-client-secret}
google.oauth2.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8060/api/v1/outreach/oauth2/callback}
github.oauth2.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:8060/api/v1/auth/callback/github}
linkedin.oauth2.redirect-uri=${LINKEDIN_REDIRECT_URI:http://localhost:8060/api/v1/auth/callback/linkedin}

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:test_secret_placeholder}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:webhook_secret_placeholder}

# Telegram Bot Configuration
telegram.bot.token=${TELEGRAM_BOT_TOKEN:8846804717:AAFCrsUlvReLai3W4m_Bb5jWYDglagMMI48}
telegram.admin.chat-id=${TELEGRAM_ADMIN_CHAT_ID:6023053509}

# Redis Cache Configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# AI Email Generation & Model Routing Config
pipeline.service.url=${PIPELINE_SERVICE_URL:http://localhost:8000}
email.llm.service-url=${pipeline.service.url}/generate-hook
email.llm.model.high-intel=gemini-1.5-pro
email.llm.model.low-cost=gemini-1.5-flash

# Google Gemini API Key
gemini.api.key=${GEMINI_API_KEY:}

# HikariCP Connection Pooling Configuration
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=2000

# CORS Allowed Origins Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:auto-apply-pro-jwt-super-secret-key-change-in-production}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# GitHub OAuth Configuration
github.client.id=${GITHUB_CLIENT_ID:dev-github-client-id}
github.client.secret=${GITHUB_CLIENT_SECRET:dev-github-client-secret}

# LinkedIn OAuth Configuration
linkedin.client.id=${LINKEDIN_CLIENT_ID:dev-linkedin-client-id}
linkedin.client.secret=${LINKEDIN_CLIENT_SECRET:dev-linkedin-client-secret}

# Gmail SMTP Mail Configuration
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}