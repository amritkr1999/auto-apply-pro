name: App Build & Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.prod.yml'
      - 'docker-compose.yml'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: amritkr1999/auto-apply-pro-backend
  FRONTEND_IMAGE: amritkr1999/auto-apply-pro-frontend

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to OCI Server
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Start SSH Agent & Load Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OCI_PRIVATE_KEY }}

      - name: Sync Compose Config to Server
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o BatchMode=yes \
              -o ConnectTimeout=60 \
              -o ServerAliveInterval=60 \
              -o ServerAliveCountMax=10 \
              "$OCI_USERNAME@$OCI_HOST" "mkdir -p ~/auto-apply-pro && cat > ~/auto-apply-pro/docker-compose.yml" < docker-compose.prod.yml

      - name: SSH and Restart Services
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o BatchMode=yes \
              -o ConnectTimeout=60 \
              -o ServerAliveInterval=60 \
              -o ServerAliveCountMax=10 \
              "$OCI_USERNAME@$OCI_HOST" "GITHUB_TOKEN='$GITHUB_TOKEN' GITHUB_ACTOR='$GITHUB_ACTOR' bash -s" << 'EOF'
            set -e
            cd ~/auto-apply-pro

            # Detect docker command (with sudo if needed)
            DOCKER_CMD="docker"
            if ! docker ps >/dev/null 2>&1; then
              if sudo docker ps >/dev/null 2>&1; then
                DOCKER_CMD="sudo docker"
              fi
            fi

            # Detect docker compose command
            if $DOCKER_CMD compose version >/dev/null 2>&1; then
              COMPOSE_CMD="$DOCKER_CMD compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            elif sudo command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="sudo docker-compose"
            else
              echo "ERROR: Neither 'docker compose' nor 'docker-compose' found on target server."
              exit 1
            fi

            echo "Using Docker command: $DOCKER_CMD"
            echo "Using Compose command: $COMPOSE_CMD"

            # Authenticate with GHCR
            echo "$GITHUB_TOKEN" | $DOCKER_CMD login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # Free up disk space before pull
            $DOCKER_CMD image prune -f

            # Ensure .env file exists
            touch .env

            # Pull images sequentially to avoid heavy I/O spikes
            $COMPOSE_CMD pull db || true
            $COMPOSE_CMD pull redis || true
            $COMPOSE_CMD pull backend || true
            $COMPOSE_CMD pull frontend || true

            # Bring up database & cache first
            $COMPOSE_CMD up -d db redis

            # Bring up application services
            $COMPOSE_CMD up -d backend frontend

            # Final cleanup
            $DOCKER_CMD image prune -f
            echo "SUCCESS: Services deployed and started successfully!"
          EOF
