name: App Build & Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.prod.yml'
      - 'docker-compose.yml'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: amritkr1999/auto-apply-pro-backend
  FRONTEND_IMAGE: amritkr1999/auto-apply-pro-frontend

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to OCI Server
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Start SSH Agent & Load Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OCI_PRIVATE_KEY }}

      - name: Deploy to OCI Server via Native SSH
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_PORT: ${{ secrets.OCI_PORT }}
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          SSH_PORT="${OCI_PORT:-22}"

          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o PubkeyAcceptedKeyTypes=+ssh-rsa,rsa-sha2-256,rsa-sha2-512 \
              -o HostKeyAlgorithms=+ssh-rsa,rsa-sha2-256,rsa-sha2-512 \
              -o ConnectTimeout=30 \
              -p "$SSH_PORT" \
              "$OCI_USERNAME@$OCI_HOST" "GITHUB_TOKEN='$GITHUB_TOKEN' GITHUB_ACTOR='$GITHUB_ACTOR' bash -s" << 'EOF'
            set -e
            mkdir -p ~/auto-apply-pro
            cd ~/auto-apply-pro

            cat << 'DOCKER_COMPOSE' > docker-compose.prod.yml
            services:
              db:
                image: postgres:17-alpine
                container_name: auto-apply-db
                environment:
                  POSTGRES_DB: ${DB_NAME:-autoapplypro}
                  POSTGRES_USER: ${DB_USER:-amrit}
                  POSTGRES_PASSWORD: ${DB_PASSWORD:-amrit123}
                ports:
                  - "127.0.0.1:5432:5432"
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                networks:
                  - app-network
                restart: unless-stopped
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-amrit} -d ${DB_NAME:-autoapplypro}"]
                  interval: 5s
                  timeout: 5s
                  retries: 5

              backend:
                image: ghcr.io/amritkr1999/auto-apply-pro-backend:latest
                container_name: auto-apply-backend
                ports:
                  - "8060:8060"
                environment:
                  DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-autoapplypro}
                  DB_USERNAME: ${DB_USER:-amrit}
                  DB_PASSWORD: ${DB_PASSWORD:-amrit123}
                  PIPELINE_SERVICE_URL: http://pipeline:8000
                  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
                  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
                  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://api.easynaukri.online/api/v1/outreach/oauth2/callback}
                  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
                  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
                  GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-https://api.easynaukri.online/api/v1/auth/callback/github}
                  LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID}
                  LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET}
                  LINKEDIN_REDIRECT_URI: ${LINKEDIN_REDIRECT_URI:-https://api.easynaukri.online/api/v1/auth/callback/linkedin}
                  JWT_SECRET: ${JWT_SECRET}
                  JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
                  SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
                  SMTP_PORT: ${SMTP_PORT:-587}
                  SMTP_USERNAME: ${SMTP_USERNAME:-notifications@easynaukri.online}
                  SMTP_PASSWORD: ${SMTP_PASSWORD}
                  SMTP_AUTH: ${SMTP_AUTH:-true}
                  SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLE:-true}
                  SMTP_STARTTLS_REQUIRED: ${SMTP_STARTTLS_REQUIRED:-true}
                  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://easynaukri.online,https://www.easynaukri.online}
                  FRONTEND_URL: ${FRONTEND_URL:-https://easynaukri.online}
                  APP_FRONTEND_URL: ${FRONTEND_URL:-https://easynaukri.online}
                depends_on:
                  db:
                    condition: service_healthy
                networks:
                  - app-network
                restart: unless-stopped

              pipeline:
                image: ghcr.io/amritkr1999/auto-apply-pro-pipeline:latest
                container_name: auto-apply-pipeline
                ports:
                  - "8000:8000"
                environment:
                  GEMINI_API_KEY: ${GEMINI_API_KEY}
                  USE_LOCAL_MODEL: ${USE_LOCAL_MODEL:-false}
                  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
                  OLLAMA_DEEPSEEK_MODEL: ${OLLAMA_DEEPSEEK_MODEL:-deepseek-vision:7b}
                  OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-ollama3.1:8b}
                  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${DB_USER:-amrit}:${DB_PASSWORD:-amrit123}@db:5432/${DB_NAME:-autoapplypro}}
                  BACKEND_API_URL: ${BACKEND_API_URL:-http://backend:8060}
                extra_hosts:
                  - "host.docker.internal:host-gateway"
                networks:
                  - app-network
                restart: unless-stopped

              redis:
                image: redis:7-alpine
                container_name: auto-apply-redis
                ports:
                  - "6379:6379"
                networks:
                  - app-network
                restart: unless-stopped

              frontend:
                image: ghcr.io/amritkr1999/auto-apply-pro-frontend:latest
                container_name: auto-apply-frontend
                ports:
                  - "3000:80"
                depends_on:
                  - backend
                networks:
                  - app-network
                restart: unless-stopped

            networks:
              app-network:
                driver: bridge

            volumes:
              postgres_data:
            DOCKER_COMPOSE

            cp -f docker-compose.prod.yml docker-compose.yml
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            docker compose pull backend frontend
            docker compose stop backend frontend || true
            docker compose rm -f backend frontend || true
            docker compose up -d --force-recreate --remove-orphans backend frontend

            sudo sed -i 's/return 404;/return 301 https:\/\/$host$request_uri;/g' /etc/nginx/sites-available/* /etc/nginx/sites-enabled/* 2>/dev/null || true
            sudo systemctl reload nginx || true

            docker image prune -f
          EOF
