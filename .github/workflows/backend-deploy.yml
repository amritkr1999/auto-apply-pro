name: App Build & Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.prod.yml'
      - 'docker-compose.yml'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: amritkr1999/auto-apply-pro-backend
  FRONTEND_IMAGE: amritkr1999/auto-apply-pro-frontend

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to OCI Server
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: SSH and Restart Services
        uses: appleboy/ssh-action@v1.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_PRIVATE_KEY }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR
          script_stop: true
          request_pty: true
          command_timeout: 15m
          script: |
            set -e
            mkdir -p ~/auto-apply-pro
            cd ~/auto-apply-pro

            # Download latest production docker-compose from repository
            curl -sSL https://raw.githubusercontent.com/amritkr1999/auto-apply-pro/main/docker-compose.prod.yml -o docker-compose.prod.yml
            cp -f docker-compose.prod.yml docker-compose.yml

            # Authenticate with GHCR
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # Pull latest containers and recreate
            docker compose pull --quiet backend frontend
            docker compose stop backend frontend || true
            docker compose rm -f backend frontend || true
            docker compose up -d --force-recreate --remove-orphans backend frontend

            # Reload Nginx configuration
            sudo sed -i 's/return 404;/return 301 https:\/\/$host$request_uri;/g' /etc/nginx/sites-available/* /etc/nginx/sites-enabled/* 2>/dev/null || true
            sudo systemctl reload nginx || true

            docker image prune -f
